<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRC Vokabeln</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    /* night: deep navy field */
    --deep: #0E2436;   /* background        */
    --lead: #EAF1F7;   /* the prompt        */
    --dim:  #6098BE;   /* the translation   */
    --mute: #3A6180;   /* slider + labels   */
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="auto"] {
      /* day: warm off-white field */
      --deep: #F4F1EA;
      --lead: #14293B;
      --dim:  #5F819B;
      --mute: #A9A296;
    }
  }
  /* manual overrides — after the media block so they win on source order */
  :root[data-theme="light"] {
    --deep: #F4F1EA;
    --lead: #14293B;
    --dim:  #5F819B;
    --mute: #A9A296;
  }
  :root[data-theme="dark"] {
    --deep: #0E2436;
    --lead: #EAF1F7;
    --dim:  #6098BE;
    --mute: #3A6180;
  }

  /* corner controls: theme dot right, the two switches left */
  #theme, #switches {
    position: fixed;
    z-index: 3;
    top: calc(3vh + env(safe-area-inset-top));
  }
  #lang, #scope {
    padding: 0;
    border: none;
    background: none;
    color: var(--mute);
    opacity: .45;
    cursor: pointer;
    transition: opacity 160ms ease, color 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #theme {
    padding: 0;
    border: none;
    background: none;
    color: var(--mute);
    opacity: .45;
    cursor: pointer;
    transition: opacity 160ms ease, color 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #theme:hover,  #theme:focus-visible,
  #lang:hover,   #lang:focus-visible,
  #scope:hover,  #scope:focus-visible { opacity: 1; color: var(--dim); }
  #theme:focus-visible, #lang:focus-visible, #scope:focus-visible { outline: none; }

  /* theme toggle: outline = light, half = auto, filled = dark */
  #theme {
    right: calc(4vw + env(safe-area-inset-right));
    width: 22px; height: 22px;
  }
  #theme svg { width: 100%; height: 100%; display: block; }
  #theme .fill { opacity: 0; transition: opacity 160ms ease; }
  :root[data-theme="auto"] #theme .half { opacity: 1; }
  :root[data-theme="dark"] #theme .full { opacity: 1; }

  /* left switches: the direction being drilled, and which cards are in play */
  #switches {
    left: calc(4vw + env(safe-area-inset-left));
    height: 22px;
    display: flex;
    align-items: center;
    gap: .8em;
  }
  #lang, #scope {
    display: flex;
    align-items: center;
    gap: .45em;
    font: inherit;
    font-size: clamp(9px, 1.5vmin, 12px);
    font-weight: 700;
    letter-spacing: .12em;
    line-height: 1;
    white-space: nowrap;
  }
  #lang .arrow { opacity: .6; }
  #scope { text-transform: uppercase; }
  #switches .sep {
    width: 1px;
    height: 11px;
    background: var(--mute);
    opacity: .35;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--deep); }
  body {
    background: var(--deep);
    color: var(--lead);
    font-family: "Space Grotesk", -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #bg {
    position: fixed;
    inset: 0;
    background: var(--deep);
    z-index: 0;
  }
  #wrap {
    position: relative;
    z-index: 1;
    width: min(86vw, 900px);
    text-align: center;
    line-height: 1.1;
    letter-spacing: -0.015em;
    text-wrap: balance;
    transition: transform 300ms cubic-bezier(.22,.7,.3,1), opacity 260ms ease;
    will-change: transform;
  }
  #wrap.hide { opacity: 0; }
  #head {
    display: block;
    color: var(--lead);
    font-weight: 700;
  }
  #tail {
    display: block;
    margin-top: .34em;
    font-size: .8em;
    font-weight: 500;
    color: var(--dim);
    opacity: 0;
    transition: opacity 200ms ease 60ms;
  }
  #wrap.reveal #tail { opacity: 1; }
  #wrap.instant, #wrap.instant #tail { transition: none; }

  /* the dock carries the verdicts, the pace slider and the status line */
  #dock {
    z-index: 2;
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(4vh + env(safe-area-inset-bottom));
    width: min(84vw, 420px);
  }
  #pace {
    width: min(100%, 360px);
    margin: 0 auto;
  }
  #speed {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    background: transparent;
    display: block;
  }
  #speed::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--mute);
  }
  #speed::-moz-range-track {
    height: 2px;
    background: var(--mute);
  }
  #speed::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--dim);
    cursor: pointer;
  }
  #speed::-moz-range-thumb {
    width: 14px; height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--dim);
    cursor: pointer;
  }
  #speed:focus-visible { outline: none; }
  #speed:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--dim) 35%, transparent); }
  #speed:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--dim) 35%, transparent); }
  #marks {
    position: relative;
    height: 1.2em;
    margin-top: .9em;
    font-size: clamp(8px, 1.4vmin, 11px);
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mute);
  }
  /* each label sits under the centre of its thumb position */
  #marks span {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    transition: color 160ms ease;
  }
  #marks span:nth-child(1) { left: 7px; }
  #marks span:nth-child(2) { left: calc(7px + (100% - 14px) / 4); }
  #marks span:nth-child(3) { left: calc(7px + (100% - 14px) / 2); }
  #marks span:nth-child(4) { left: calc(7px + (100% - 14px) * 3 / 4); }
  #marks span:nth-child(5) { left: calc(100% - 7px); }
  #marks span.on { color: var(--dim); }

  /* one row holds the hint before the reveal and the verdicts after, so the
     field above keeps its height and the type never resizes mid-card */
  #answer { display: none; }
  body.cards #answer {
    display: grid;
    margin-bottom: 2em;
  }
  #answer > * { grid-area: 1 / 1; }
  #hint, #judge { transition: opacity 180ms ease; }
  #hint {
    align-self: center;
    text-align: center;
    pointer-events: none;   /* it sits over the verdicts, so it must not catch them */
    font-size: clamp(8px, 1.4vmin, 11px);
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--mute);
  }
  #hint .click { display: none; }
  @media (hover: hover) and (pointer: fine) {
    #hint .tap { display: none; }
    #hint .click { display: inline; }
  }
  #judge {
    display: flex;
    gap: .7em;
    opacity: 0;
  }
  body.shown #judge { opacity: 1; }
  body.shown #hint { opacity: 0; }
  .verdict {
    flex: 1;
    min-height: clamp(46px, 8.5vh, 64px);
    padding: 0 .5em;
    border: 1.5px solid var(--dim);
    border-radius: 3px;
    background: none;
    color: var(--dim);
    font: inherit;
    font-size: clamp(10px, 1.9vmin, 14px);
    font-weight: 700;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: background 140ms ease, color 140ms ease,
                border-color 140ms ease, transform 120ms ease;
  }
  .verdict:focus-visible {
    outline: none;
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--dim) 30%, transparent);
  }
  .verdict:active { transform: scale(.98); }
  #wrong { border-color: var(--mute); color: var(--mute); }
  #wrong:hover, #wrong:focus-visible { border-color: var(--dim); color: var(--dim); }
  #right { background: var(--dim); border-color: var(--dim); color: var(--deep); }
  #right:hover, #right:focus-visible { background: var(--lead); border-color: var(--lead); }

  /* the card waits for a tap, so the field reads as the thing you press —
     and a tap on a word must never turn into a text selection */
  body.cards:not(.shown) #wrap { cursor: pointer; }
  body.cards {
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  /* the drill turns cards by hand: the field settles faster than on a timer */
  body.cards #wrap {
    transition: transform 220ms cubic-bezier(.22,.7,.3,1), opacity 130ms ease;
  }

  #total {
    margin-top: .7em;
    text-align: center;
    font-size: clamp(8px, 1.4vmin, 11px);
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mute);
  }

  /* end of a round: the field clears, a rule draws itself under the count */
  #lap {
    position: fixed;
    inset: 0;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .9em;
    opacity: 0;
    pointer-events: none;
    transition: opacity 280ms ease;
  }
  #lap.on { opacity: 1; }
  #lap span {
    font-size: clamp(13px, 2.4vmin, 20px);
    font-weight: 500;
    letter-spacing: .24em;
    text-transform: uppercase;
    color: var(--dim);
  }
  #lap #lapsub {
    font-size: clamp(9px, 1.7vmin, 13px);
    letter-spacing: .2em;
    color: var(--mute);
  }
  #lap #lapsub:empty { display: none; }
  #lap .rule {
    display: block;
    width: min(46vw, 320px);
    height: 2px;
    background: var(--dim);
    transform: scaleX(0);
    transition: transform 820ms cubic-bezier(.22,.7,.3,1);
  }
  #lap.on .rule { transform: scaleX(1); }

  @media (prefers-reduced-motion: reduce) {
    #wrap, body.cards #wrap, #tail, #lap, #lap .rule,
    #hint, #judge, .verdict { transition: none; }
    #lap .rule { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <div id="bg"></div>

  <div id="switches">
    <button id="lang" type="button" aria-label="Richtung: Deutsch nach Englisch" title="Richtung: Deutsch nach Englisch">
      <span id="from">DE</span><span class="arrow">&#8594;</span><span id="to">EN</span>
    </button>
    <span class="sep" aria-hidden="true"></span>
    <button id="scope" type="button"></button>
  </div>

  <button id="theme" type="button" aria-label="Theme: auto" title="Theme: auto">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path class="fill half" d="M10 2.75a7.25 7.25 0 0 1 0 14.5z" fill="currentColor"/>
      <circle class="fill full" cx="10" cy="10" r="7.25" fill="currentColor"/>
    </svg>
  </button>

  <div id="wrap"><span id="head"></span><span id="tail"></span></div>

  <div id="lap" aria-hidden="true"><span id="lapnum"></span><i class="rule"></i><span id="lapsub"></span></div>

  <div id="dock">
    <div id="answer">
      <div id="hint" aria-hidden="true"><span class="tap">Tippen zum Aufdecken</span><span class="click">Klicken zum Aufdecken</span></div>
      <div id="judge">
        <button id="wrong" class="verdict" type="button" disabled>Falsch</button>
        <button id="right" class="verdict" type="button" disabled>Richtig</button>
      </div>
    </div>
    <div id="pace">
      <input id="speed" type="range" min="0" max="4" step="1" value="2" aria-label="Tempo und Modus">
      <div id="marks"><span>Flott</span><span>Zügig</span><span>Normal</span><span>Ruhig</span><span>Karten</span></div>
    </div>
    <div id="total" aria-live="polite"></div>
  </div>

<script>
// [German, English, complexity: 1 plain, 2 middling, 3 hard]
const CARDS = [
  ["manövrierunfähig", "not under command", 2],
  ["Schiff treibt manövrierunfähig", "vessel is not under command, drifting", 3],
  ["Wassereinbruch", "flooding", 1],
  ["Yacht sinkt nach Wassereinbruch", "yacht is sinking after flooding", 2],
  ["starke Schlagseite nach Backbord", "heavy list to port side", 3],
  ["Ruder gebrochen", "rudder broken", 2],
  ["Ruderschaden", "damaged rudder", 2],
  ["defekte Ruderanlage", "defective steering gear", 2],
  ["gebrochener Mast", "broken mast", 1],
  ["Motorschaden", "engine trouble", 1],
  ["Maschinenraum · Motorraum", "engine room", 1],
  ["nach einer Explosion", "after explosion", 1],
  ["Schiff brennt", "vessel on fire", 1],
  ["Feuer in den Aufbauten", "fire in superstructures", 2],
  ["Feuer nicht unter Kontrolle", "fire not under control", 1],
  ["Schiff in kritischem Zustand", "ship is in critical condition", 1],
  ["Kollision mit Fischereifahrzeug", "in collision with fishing vessel", 3],
  ["treiben auf die Sände zu", "drifting towards the banks", 2],
  ["wir müssen das Schiff verlassen", "we have to abandon the vessel", 2],
  ["benötigen sofortige Hilfe", "require immediate assistance", 1],
  ["benötige Schlepperhilfe", "require tug assistance", 2],
  ["Hilfe bei der Brandabwehr leisten", "to assist in fire fighting", 3],
  ["diese Position ansteuern, um Hilfe zu leisten", "to approach to this position for assistance", 3],
  ["Position, Kurs und Geschwindigkeit angeben", "indicate position, course and speed", 2],
  ["für mögliche Hilfeleistung", "for possible assistance", 1],
  ["benötigen Hubschrauber", "require helicopter", 1],
  ["Person / Mensch über Bord", "person over board", 1],
  ["zuletzt gesichtet um 0730 UTC", "last seen at 0730 UTC", 1],
  ["Besatzungsmitglied", "crew member", 2],
  ["schwer verletzt", "seriously injured", 1],
  ["bewusstlos", "unconscious", 1],
  ["Verdacht auf Herzinfarkt", "suspect of heart attack", 2],
  ["benötige dringend ärztliche Hilfe", "require urgent medical assistance", 1],
  ["medizinische Hilfe per Hubschrauber", "medical assistance by helicopter", 1],
  ["ist vom Mast gefallen", "has fallen off the mast", 2],
  ["Überlebende wurden nicht gesichtet", "survivors were not sighted", 2],
  ["gekentertes Rettungsfloß", "capsized life raft", 2],
  ["zwei Personen an Bord", "two persons on board", 1],
  ["Schiffe in der Nähe werden gebeten …", "ships in vicinity are requested to …", 2],
  ["die Schifffahrt wird gebeten …", "shipping is requested to …", 2],
  ["scharf Ausschau halten", "to keep sharp lookout", 2],
  ["der Seenotleitung Bremen berichten", "report to Maritime Rescue Coordination Centre Bremen", 3],
  ["vorsichtig navigieren", "to navigate carefully", 1],
  ["weder ankern noch Fischereigeschirr nutzen", "neither to anchor nor to use fishing gear", 3],
  ["Abstand von mehr als 2 sm halten", "to keep a berth of more than 2 nm", 3],
  ["Küstenwache", "Coast Guard", 1],
  ["in der Nähe von", "in vicinity of", 2],
  ["auf Position", "in position", 2],
  ["Leucht- und Heultonne", "light and whistle buoy", 2],
  ["als verlöscht gemeldet", "is reported unlit", 3],
  ["Betonnung", "buoyage", 2],
  ["Fahrwasser", "fairway", 2],
  ["Verkehrstrennungsgebiet", "traffic separation scheme", 2],
  ["Tiefwasserweg", "deep water lane", 2],
  ["Nautische Warnung", "navigational warning", 2],
  ["Nachrichten für Seefahrer", "notices to mariners", 2],
  ["Unterwasser-Kabelarbeiten werden durchgeführt", "underwater cable operations in progress", 3],
  ["wird durchgeführt werden vom … bis …", "will be carried out from … to …", 3],
  ["laut", "according to", 1],
  ["rote Raketen beobachtet", "red rockets observed", 1],
  ["treibende 40-Fuß-Container, rot gestrichen", "drifting 40-feet containers, red painted", 2],
  ["ein Container mit der Aufschrift …", "one container marked with …", 2],
  ["den Anker verloren", "has lost anchor", 2],
  ["rechtweisende Peilung 45 Grad", "true bearing of 45 degrees", 3],
  ["rechtweisender Kurs", "true course", 3],
  ["12 sm südlich Kap …", "12 nm south of Cape …", 2],
  ["Seemeile (sm)", "nautical mile (nm)", 2],
  ["Sturmwarnung", "gale warning", 2],
  ["Vorhersagegebiet", "forecast area", 1],
  ["Windstärke 8 bis 9", "force 8 to 9", 2],
  ["zunehmend auf Sturmstärke", "increasing to gale force", 2],
  ["abnehmend auf 7", "decreasing to force 7", 2],
  ["rasch zunehmend", "rapidly increasing", 1],
  ["rechtdrehend", "veering", 3],
  ["linksdrehend", "backing", 3],
  ["starke westliche Winde", "strong westerly winds", 2],
  ["raue See", "rough sea", 1],
  ["sehr schwere See", "very rough sea", 1],
  ["hohe Dünung", "high swell", 2],
  ["Sprühregen, zeitweise", "drizzle at times", 2],
  ["Schauer", "showers", 1],
  ["mäßige bis schlechte Sicht", "moderate to poor visibility", 1],
  ["überfällig seit 16. Januar", "overdue since January 16th", 1],
  ["unterwegs von … nach …", "underway from … to …", 2],
  ["mit Bestimmungshafen Visby", "bound for Visby", 3],
  ["ist bisher dort nicht eingetroffen", "has not yet arrived there", 2],
  ["verließ Klintholm um 0600 Ortszeit", "left Klintholm at 0600 local time", 2],
  ["Rumpf", "hull", 1],
  ["Aufbauten", "superstructures", 1],
  ["Segel", "sails", 1],
  ["Länge 12 m", "length 12 m", 1],
  ["Länge 40 Fuß", "length 40 feet", 1],
  ["Motorschiff", "M/V (motor vessel)", 2],
  ["Rufzeichen", "C/S (call sign)", 2],
  ["Geschwindigkeit 13 Knoten", "speed 13 knots", 1],
  ["folgendes empfangen auf UKW-Kanal 16", "following received on VHF channel 16", 3],
  ["gesichtet", "sighted", 1],
  ["beobachtet", "observed", 1],
  ["in diesem Gebiet", "in this area", 1],
  ["Komma", "DECIMAL", 3]
];
  // pace scales a budget that grows with the phrase: reading time tracks
  // letters rather than words, so a German compound gets the time it needs.
  // the fifth stop is not a pace at all but the card drill, so it never scales
  const PACE = [0.45, 0.62, 0.85, 1.15, null];
  const PROMPT_MS = [800, 120];   // [fixed, per letter] before the reveal
  const ANSWER_MS = [650, 90];    // [fixed, per letter] once the pair is up
  const FLOOR = 800, CEILING = 9000;

  const wrap  = document.getElementById("wrap");
  const head  = document.getElementById("head");
  const tail  = document.getElementById("tail");
  const speed = document.getElementById("speed");
  const marks = document.querySelectorAll("#marks span");
  const langBtn = document.getElementById("lang");
  const arrow = document.querySelector("#lang .arrow");
  const scopeBtn = document.getElementById("scope");
  const dock  = document.getElementById("dock");
  const total = document.getElementById("total");
  const lap    = document.getElementById("lap");
  const lapnum = document.getElementById("lapnum");
  const lapsub = document.getElementById("lapsub");
  const from  = document.getElementById("from");
  const to    = document.getElementById("to");
  const noBtn  = document.getElementById("wrong");
  const yesBtn = document.getElementById("right");

  // which complexities are in play: everything, the harder two thirds, or the hardest
  const SCOPES = [
    { floor: 1, label: "Alle",    aria: "Auswahl: alle Vokabeln" },
    { floor: 2, label: "Mittel+", aria: "Auswahl: mittlere und komplexe Vokabeln" },
    { floor: 3, label: "Komplex", aria: "Auswahl: nur komplexe Vokabeln" }
  ];
  let scope = 0;
  let POOL = CARDS;

  // the last stop on the slider is not a pace but the hand-turned card drill
  const CARD = 4;
  let pace = 2;
  let cards = false;
  let lang = 0;                // 0 = DE -> EN, 1 = EN -> DE, 2 = both mixed
  const MIX = 2;
  let revealed = false;
  let deck = [], last = null;
  let timer = null;
  let round = 0, running = false;
  let ready = false;

  // settings persist in localStorage; silently ignored where it's unavailable
  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* no storage, no problem */ }
  }
  function read(key) {
    try { return JSON.parse(load(key)); } catch (e) { return null; }
  }

  /* ---- ticker: every phrase once per round, on a timer -------------------- */

  // every phrase comes up once per round; a reshuffle never repeats the last one
  function refill() {
    deck = POOL.map(function (c, i) { return i; });
    shuffle(deck);
    if (deck[deck.length - 1] === last && deck.length > 1) {
      [deck[deck.length - 1], deck[0]] = [deck[0], deck[deck.length - 1]];
    }
    round++;
  }

  function shuffle(a) {
    for (let j = a.length - 1; j > 0; j--) {
      const k = Math.floor(Math.random() * (j + 1));
      [a[j], a[k]] = [a[k], a[j]];
    }
    return a;
  }

  function draw() {
    last = deck.pop();
    return POOL[last];
  }

  // an empty deck means the round is over: mark it, then roll straight on
  function next() {
    if (deck.length) return showPrompt();
    if (running) return interlude();
    refill();
    running = true;
    showPrompt();
  }

  function interlude() {
    wrap.classList.add("hide");
    timer = setTimeout(function () {
      refill();
      lapnum.textContent = "Runde " + round;
      lapsub.textContent = "";
      lap.classList.add("on");
      timer = setTimeout(function () {
        lap.classList.remove("on");
        wrap.classList.remove("hide");
        showPrompt();
      }, 1150);
    }, 300);
  }

  /* ---- the field --------------------------------------------------------- */

  // a compound too long to break stays on one line and runs past the edge of
  // the field without making the block any taller, so measure the line boxes
  const range = document.createRange();
  function widest() {
    let w = 0;
    [head, tail].forEach(function (el) {
      range.selectNodeContents(el);
      const rects = range.getClientRects();
      for (let i = 0; i < rects.length; i++) w = Math.max(w, rects[i].width);
    });
    return w;
  }

  // phrases run long, so the type shrinks until the pair clears the controls
  function fit() {
    // reserve whatever the control block actually occupies, plus air
    const reserve = window.innerHeight - dock.getBoundingClientRect().top + 16;
    const room = window.innerHeight / 2 - reserve;
    const maxW = wrap.clientWidth;
    const min  = 13;
    let size = Math.min(window.innerWidth * 0.105, window.innerHeight * 0.115);
    wrap.style.fontSize = size + "px";
    let guard = 0;
    // the prompt phase rides half the translation's height lower, so budget for that
    while (size > min && guard++ < 80 &&
           (wrap.offsetHeight / 2 + drop() > room || widest() > maxW)) {
      size *= 0.94;
      wrap.style.fontSize = size + "px";
    }
  }

  function drop() {
    const gap = parseFloat(getComputedStyle(tail).marginTop) || 0;
    return (tail.offsetHeight + gap) / 2;
  }

  // before the reveal the prompt sits centred; the translation waits underneath
  function place() {
    wrap.classList.add("instant");
    wrap.style.transform = "none";
    void wrap.offsetWidth;
    wrap.style.transform = revealed ? "translateY(0)" : "translateY(" + drop() + "px)";
    void wrap.offsetWidth;
  }

  // the pair rises into place and the translation fades up under the prompt
  function lift() {
    wrap.classList.remove("instant");
    void wrap.offsetWidth;
    wrap.style.transform = "translateY(0)";
    wrap.classList.add("reveal");
  }

  function clear() {
    revealed = false;
    wrap.classList.remove("reveal");
    document.body.classList.remove("shown");
    noBtn.disabled = yesBtn.disabled = true;
  }

  // spaces and punctuation cost no reading time worth counting; the class is
  // Unicode-aware so Umlaute and ß count like any other letter
  function letters(text) {
    return (text.match(/[\p{L}\p{N}]/gu) || []).length;
  }

  function span(ms, text) {
    return Math.min(CEILING, Math.max(FLOOR, (ms[0] + ms[1] * letters(text)) * PACE[pace]));
  }

  function showPrompt() {
    face(draw(), side());
    timer = setTimeout(showAnswer, span(PROMPT_MS, head.textContent));
  }

  function showAnswer() {
    revealed = true;
    lift();
    timer = setTimeout(next, span(ANSWER_MS, tail.textContent));
  }

  // mixed draws a side per card, so a word can come up either way round
  function side() {
    return lang === MIX ? (Math.random() < 0.5 ? 0 : 1) : lang;
  }

  // put a pair on the field, prompt up, translation held back
  function face(pair, d) {
    clear();
    head.textContent = pair[d];
    tail.textContent = pair[1 - d];
    fit();
    place();
  }

  /* ---- card drill: turned by hand, spaced by hand ------------------------- */

  const DAY = 864e5;
  const AGAIN = 3, AGAIN_AGAIN = 9;  // how far back a card drops when it comes back
  const STUCK = 3;                   // misses in one round before it is set aside
  let MEM = fold(read("src.mem") || {});
  let queue = [], cur = null;
  let done = 0, hits = 0, miss = 0;
  let busy = false;

  // one record per card, whichever way round it was drilled: a vocabulary item
  // is one thing to know, so DE, EN and mixed all read and write the same state
  function id(card) { return card[0] + "␟" + card[1]; }

  // memory was once kept per direction; fold those halves together and keep
  // the weaker of the two, so nothing already learned is claimed twice
  function fold(mem) {
    const out = {};
    Object.keys(mem).forEach(function (k) {
      const m = mem[k], base = k.replace(/␟[01]$/, ""), had = out[base];
      out[base] = had ? {
        n: Math.min(had.n, m.n),
        e: Math.min(had.e, m.e),
        i: Math.min(had.i, m.i),
        d: Math.min(had.d, m.d),
        l: had.l + m.l
      } : m;
    });
    return out;
  }
  function grades(card) {
    const k = id(card);
    return MEM[k] || (MEM[k] = { n: 0, e: 2.5, i: 0, d: 0, l: 0 });
  }
  function when(card) {
    const m = MEM[id(card)];
    return m ? m.d : 0;
  }

  function keep() {
    save("src.mem", JSON.stringify(MEM));
    save("src.run", JSON.stringify({
      t: lang + ":" + scope, r: round, d: done, h: hits, m: miss,
      q: queue.map(function (x) {
        return [id(POOL[x.i]), x.again, x.step, x.tried, x.misses, x.d];
      })
    }));
  }

  // the round always holds the whole pool — what the spacing decides is the
  // order: unseen and overdue cards lead, long intervals trail behind
  function newRound(n) {
    round = n;
    done = hits = miss = 0;
    const order = shuffle(POOL.map(function (c, i) { return i; }));
    order.sort(function (a, b) { return when(POOL[a]) - when(POOL[b]); });
    // a card keeps the side it was dealt, so a miss comes back the same way
    queue = order.map(function (i) {
      return { i: i, again: 0, step: 0, tried: 0, misses: 0, d: side() };
    });
    keep();
  }

  // pick the round back up where it was left, as long as nothing about the
  // deck has moved under it
  function resume() {
    const s = read("src.run");
    if (!s || s.t !== lang + ":" + scope || !s.q || !s.q.length) return false;
    const at = {};
    POOL.forEach(function (c, i) { at[id(c)] = i; });
    queue = [];
    s.q.forEach(function (e) {
      const i = at[e[0]];
      if (i !== undefined) {
        queue.push({
          i: i, again: e[1], step: e[2],
          tried: e[3], misses: e[4] || 0, d: e[5] ? 1 : 0
        });
      }
    });
    if (!queue.length) return false;
    round = s.r || 1;
    done = s.d || 0; hits = s.h || 0; miss = s.m || 0;
    return true;
  }

  function startCards() {
    busy = false;
    if (!resume()) newRound(1);
    step();
  }

  function step() {
    cur = queue[0];
    face(POOL[cur.i], cur.d);
    status();
  }

  function flip() {
    if (!cards || revealed || busy || lap.classList.contains("on")) return;
    revealed = true;
    lift();
    document.body.classList.add("shown");
    noBtn.disabled = yesBtn.disabled = false;
  }

  // the verdict feeds both clocks: the long-term interval on the card, and the
  // backlog of this round, where a miss drops the card a few places back and
  // has to be met twice before it leaves
  function grade(ok) {
    if (!cards || !revealed || busy || !cur) return;
    const m = grades(POOL[cur.i]);
    if (ok) {
      m.n++;
      m.i = m.n === 1 ? 1 : m.n === 2 ? 3 : Math.max(1, Math.round(m.i * m.e));
      m.e = Math.min(2.8, m.e + 0.05);
      m.d = Date.now() + m.i * DAY;
    } else {
      m.n = 0;
      m.l++;
      m.i = 0;
      m.e = Math.max(1.3, m.e - 0.2);
      m.d = Date.now();
    }
    // the round's score counts first sight only, repeats are the drill working
    if (!cur.tried) { cur.tried = 1; if (ok) hits++; else miss++; }
    queue.shift();
    if (!ok) {
      cur.again = 1;
      cur.step = 0;
      cur.misses++;
      // a card that keeps going down is set aside rather than held in front of
      // the others; it stays due, so it leads the next round instead
      if (cur.misses >= STUCK) done++;
      else requeue(AGAIN);
    } else if (cur.again && cur.step === 0) {
      cur.step = 1;
      requeue(AGAIN_AGAIN);
    } else {
      done++;
    }
    keep();
    turn();
  }

  function requeue(gap) {
    queue.splice(Math.min(gap, queue.length), 0, cur);
  }

  function turn() {
    busy = true;
    clear();
    status();
    wrap.classList.add("hide");
    timer = setTimeout(function () {
      if (!queue.length) return finish();
      step();
      busy = false;
      fade();
    }, 150);
  }

  function fade() {
    wrap.classList.remove("instant");
    void wrap.offsetWidth;
    wrap.classList.remove("hide");
  }

  // the round is only through once every repetition has been met as well
  function finish() {
    lapnum.textContent = "Runde " + round;
    lapsub.textContent = (hits + miss)
      ? Math.round(hits * 100 / (hits + miss)) + " % auf Anhieb"
      : "";
    lap.classList.add("on");
    timer = setTimeout(function () {
      lap.classList.remove("on");
      lapsub.textContent = "";
      newRound(round + 1);
      step();
      busy = false;
      fade();
    }, 1900);
  }

  noBtn.addEventListener("click", function () { grade(false); });
  yesBtn.addEventListener("click", function () { grade(true); });

  // the field itself is the reveal: anywhere but the controls turns the card
  document.addEventListener("click", function (e) {
    if (!cards || revealed) return;
    if (e.target.closest && e.target.closest("#dock, #switches, #theme")) return;
    flip();
  });

  document.addEventListener("keydown", function (e) {
    if (!cards || busy || lap.classList.contains("on")) return;
    const on = (e.target && e.target.tagName) || "";
    if (on === "INPUT" || on === "BUTTON") return;   // the control keeps its own keys
    if (!revealed) {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); flip(); }
      return;
    }
    if (e.key === "1" || e.key === "ArrowLeft") { e.preventDefault(); grade(false); }
    if (e.key === "2" || e.key === "ArrowRight" || e.key === " " || e.key === "Enter") {
      e.preventDefault();
      grade(true);
    }
  });

  /* ---- controls ---------------------------------------------------------- */

  function restart() {
    clearTimeout(timer);
    lap.classList.remove("on");
    lapsub.textContent = "";
    wrap.classList.remove("hide");
    busy = false;
    clear();
    if (cards) return startCards();
    deck = [];
    last = null;
    round = 0;
    running = false;
    next();
  }

  function status() {
    if (!cards) return roundLength();
    if (!round) return;             // nothing drawn yet
    const back = queue.reduce(function (n, x) { return n + (x.again ? 1 : 0); }, 0);
    total.textContent = "Runde " + round + " · " + done + " von " + POOL.length +
                        (back ? " · " + back + " Wiederholungen" : "");
  }

  // a full round is the sum of every card's two phases at the current settings;
  // mixed lands somewhere between the two directions, so take the middle
  function roundLength() {
    let ms = 0;
    for (let i = 0; i < POOL.length; i++) {
      const there = span(PROMPT_MS, POOL[i][0]) + span(ANSWER_MS, POOL[i][1]);
      const back  = span(PROMPT_MS, POOL[i][1]) + span(ANSWER_MS, POOL[i][0]);
      ms += lang === MIX ? (there + back) / 2 : (lang ? back : there);
    }
    const secs = Math.round(ms / 1000);
    total.textContent = POOL.length + " Vokabeln · " + Math.floor(secs / 60) +
                        ":" + ("0" + (secs % 60)).slice(-2) + " min pro Runde";
  }

  function setPace() {
    const was = cards;
    pace = +speed.value;
    cards = pace === CARD;
    marks.forEach((m, n) => m.classList.toggle("on", n === pace));
    document.body.classList.toggle("cards", cards);
    save("src.pace", pace);
    if (!ready) return;
    if (was !== cards) restart();
    status();
    fit();
    place();
  }

  const LABEL = ["Deutsch nach Englisch", "Englisch nach Deutsch", "gemischt"];
  const ARROW = ["→", "→", "⇄"];
  function setLang() {
    from.textContent = lang === 1 ? "EN" : "DE";
    to.textContent   = lang === 1 ? "DE" : "EN";
    arrow.textContent = ARROW[lang];
    langBtn.setAttribute("aria-label", "Richtung: " + LABEL[lang]);
    langBtn.setAttribute("title", "Richtung: " + LABEL[lang]);
    status();
    save("src.lang", lang);
  }
  langBtn.addEventListener("click", function () {
    lang = (lang + 1) % LABEL.length;
    setLang();
    restart();
  });

  function setScope() {
    const s = SCOPES[scope];
    POOL = CARDS.filter(function (c) { return c[2] >= s.floor; });
    scopeBtn.textContent = s.label;
    scopeBtn.setAttribute("aria-label", s.aria);
    scopeBtn.setAttribute("title", s.aria);
    status();
    save("src.scope", scope);
  }
  scopeBtn.addEventListener("click", function () {
    scope = (scope + 1) % SCOPES.length;
    setScope();
    restart();
  });

  // theme: auto -> light -> dark -> auto
  const THEMES = ["auto", "light", "dark"];
  const root  = document.documentElement;
  const theme = document.getElementById("theme");

  let t = Math.max(0, THEMES.indexOf(load("src.theme")));
  function setTheme() {
    root.dataset.theme = THEMES[t];
    theme.setAttribute("aria-label", "Theme: " + THEMES[t]);
    theme.setAttribute("title", "Theme: " + THEMES[t]);
    save("src.theme", THEMES[t]);
  }
  theme.addEventListener("click", function () {
    t = (t + 1) % THEMES.length;
    setTheme();
  });
  setTheme();

  const savedPace = parseInt(load("src.pace"), 10);
  if (savedPace >= 0 && savedPace < PACE.length) speed.value = savedPace;
  const savedLang = parseInt(load("src.lang") || load("src.dir"), 10);
  if (savedLang >= 0 && savedLang < LABEL.length) lang = savedLang;
  const savedScope = parseInt(load("src.scope"), 10);
  if (savedScope >= 0 && savedScope < SCOPES.length) scope = savedScope;
  setPace();
  setLang();
  setScope();
  ready = true;

  speed.addEventListener("input", setPace);
  window.addEventListener("resize", function () { fit(); place(); });

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { restart(); });
  } else {
    restart();
  }
</script>
</body>
</html>
