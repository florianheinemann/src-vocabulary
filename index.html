<!DOCTYPE html>
<html lang="de" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SRC Vokabeln</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    /* night: deep navy field */
    --deep: #0E2436;   /* background        */
    --lead: #EAF1F7;   /* the prompt        */
    --dim:  #6098BE;   /* the translation   */
    --mute: #3A6180;   /* slider + labels   */
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="auto"] {
      /* day: warm off-white field */
      --deep: #F4F1EA;
      --lead: #14293B;
      --dim:  #5F819B;
      --mute: #A9A296;
    }
  }
  /* manual overrides — after the media block so they win on source order */
  :root[data-theme="light"] {
    --deep: #F4F1EA;
    --lead: #14293B;
    --dim:  #5F819B;
    --mute: #A9A296;
  }
  :root[data-theme="dark"] {
    --deep: #0E2436;
    --lead: #EAF1F7;
    --dim:  #6098BE;
    --mute: #3A6180;
  }

  /* corner controls: theme dot right, language switch left */
  #theme, #lang {
    position: fixed;
    z-index: 3;
    top: calc(3vh + env(safe-area-inset-top));
    padding: 0;
    border: none;
    background: none;
    color: var(--mute);
    opacity: .45;
    cursor: pointer;
    transition: opacity 160ms ease, color 160ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  #theme:hover, #theme:focus-visible,
  #lang:hover,  #lang:focus-visible { opacity: 1; color: var(--dim); }
  #theme:focus-visible, #lang:focus-visible { outline: none; }

  /* theme toggle: outline = light, half = auto, filled = dark */
  #theme {
    right: calc(4vw + env(safe-area-inset-right));
    width: 22px; height: 22px;
  }
  #theme svg { width: 100%; height: 100%; display: block; }
  #theme .fill { opacity: 0; transition: opacity 160ms ease; }
  :root[data-theme="auto"] #theme .half { opacity: 1; }
  :root[data-theme="dark"] #theme .full { opacity: 1; }

  /* language switch: reads as the direction being drilled */
  #lang {
    left: calc(4vw + env(safe-area-inset-left));
    height: 22px;
    display: flex;
    align-items: center;
    gap: .45em;
    font: inherit;
    font-size: clamp(9px, 1.5vmin, 12px);
    font-weight: 700;
    letter-spacing: .12em;
    line-height: 1;
  }
  #lang .arrow { opacity: .6; }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: var(--deep); }
  body {
    background: var(--deep);
    color: var(--lead);
    font-family: "Space Grotesk", -apple-system, "Segoe UI", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #bg {
    position: fixed;
    inset: 0;
    background: var(--deep);
    z-index: 0;
  }
  #wrap {
    position: relative;
    z-index: 1;
    width: min(86vw, 900px);
    text-align: center;
    line-height: 1.1;
    letter-spacing: -0.015em;
    text-wrap: balance;
    transition: transform 300ms cubic-bezier(.22,.7,.3,1);
    will-change: transform;
  }
  #head {
    display: block;
    color: var(--lead);
    font-weight: 700;
  }
  #tail {
    display: block;
    margin-top: .34em;
    font-size: .8em;
    font-weight: 500;
    color: var(--dim);
    opacity: 0;
    transition: opacity 200ms ease 60ms;
  }
  #wrap.reveal #tail { opacity: 1; }
  #wrap.instant, #wrap.instant #tail { transition: none; }

  /* pace control */
  #pace {
    z-index: 2;
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(4vh + env(safe-area-inset-bottom));
    width: min(82vw, 360px);
  }
  #speed {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    background: transparent;
    display: block;
  }
  #speed::-webkit-slider-runnable-track {
    height: 2px;
    background: var(--mute);
  }
  #speed::-moz-range-track {
    height: 2px;
    background: var(--mute);
  }
  #speed::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px; height: 14px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--dim);
    cursor: pointer;
  }
  #speed::-moz-range-thumb {
    width: 14px; height: 14px;
    border: none;
    border-radius: 50%;
    background: var(--dim);
    cursor: pointer;
  }
  #speed:focus-visible { outline: none; }
  #speed:focus-visible::-webkit-slider-thumb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--dim) 35%, transparent); }
  #speed:focus-visible::-moz-range-thumb { box-shadow: 0 0 0 4px color-mix(in srgb, var(--dim) 35%, transparent); }
  #marks {
    position: relative;
    height: 1.2em;
    margin-top: .9em;
    font-size: clamp(8px, 1.4vmin, 11px);
    font-weight: 500;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--mute);
  }
  /* each label sits under the centre of its thumb position */
  #marks span {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    white-space: nowrap;
    transition: color 160ms ease;
  }
  #marks span:nth-child(1) { left: 7px; }
  #marks span:nth-child(2) { left: calc(7px + (100% - 14px) / 4); }
  #marks span:nth-child(3) { left: calc(7px + (100% - 14px) / 2); }
  #marks span:nth-child(4) { left: calc(7px + (100% - 14px) * 3 / 4); }
  #marks span:nth-child(5) { left: calc(100% - 7px); }
  #marks span.on { color: var(--dim); }

  @media (prefers-reduced-motion: reduce) {
    #wrap, #tail { transition: none; }
  }
</style>
</head>
<body>
  <div id="bg"></div>

  <button id="lang" type="button" aria-label="Richtung: Deutsch nach Englisch" title="Richtung: Deutsch nach Englisch">
    <span id="from">DE</span><span class="arrow">&#8594;</span><span id="to">EN</span>
  </button>

  <button id="theme" type="button" aria-label="Theme: auto" title="Theme: auto">
    <svg viewBox="0 0 20 20" aria-hidden="true">
      <circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <path class="fill half" d="M10 2.75a7.25 7.25 0 0 1 0 14.5z" fill="currentColor"/>
      <circle class="fill full" cx="10" cy="10" r="7.25" fill="currentColor"/>
    </svg>
  </button>

  <div id="wrap"><span id="head"></span><span id="tail"></span></div>

  <div id="pace">
    <input id="speed" type="range" min="0" max="4" step="1" value="2" aria-label="Tempo">
    <div id="marks"><span>Flott</span><span>Zügig</span><span>Normal</span><span>Ruhig</span><span>Langsam</span></div>
  </div>

<script>
const PAIRS = [
  ["manövrierunfähig", "not under command"],
  ["Schiff treibt manövrierunfähig", "vessel is not under command, drifting"],
  ["Wassereinbruch", "flooding"],
  ["Yacht sinkt nach Wassereinbruch", "yacht is sinking after flooding"],
  ["starke Schlagseite nach Backbord", "heavy list to port side"],
  ["Ruder gebrochen · Ruderschaden", "rudder broken · damaged rudder"],
  ["defekte Ruderanlage", "defective steering gear"],
  ["gebrochener Mast", "broken mast"],
  ["Motorschaden", "engine trouble"],
  ["Maschinenraum · Motorraum", "engine room"],
  ["nach einer Explosion", "after explosion"],
  ["Schiff brennt", "vessel on fire"],
  ["Feuer in den Aufbauten", "fire in superstructures"],
  ["Feuer nicht unter Kontrolle", "fire not under control"],
  ["Schiff in kritischem Zustand", "ship is in critical condition"],
  ["Kollision mit Fischereifahrzeug", "in collision with fishing vessel"],
  ["treiben auf die Sände zu", "drifting towards the banks"],
  ["wir müssen das Schiff verlassen", "we have to abandon the vessel"],
  ["benötigen sofortige Hilfe", "require immediate assistance"],
  ["benötige Schlepperhilfe", "require tug assistance"],
  ["Hilfe bei der Brandabwehr leisten", "to assist in fire fighting"],
  ["diese Position ansteuern, um Hilfe zu leisten", "to approach to this position for assistance"],
  ["Position, Kurs und Geschwindigkeit angeben", "indicate position, course and speed"],
  ["für mögliche Hilfeleistung", "for possible assistance"],
  ["benötigen Hubschrauber", "require helicopter"],
  ["Person / Mensch über Bord", "person over board"],
  ["zuletzt gesichtet um 0730 UTC", "last seen at 0730 UTC"],
  ["Besatzungsmitglied", "crew member"],
  ["schwer verletzt", "seriously injured"],
  ["bewusstlos", "unconscious"],
  ["Verdacht auf Herzinfarkt", "suspect of heart attack"],
  ["benötige dringend ärztliche Hilfe", "require urgent medical assistance"],
  ["medizinische Hilfe per Hubschrauber", "medical assistance by helicopter"],
  ["ist vom Mast gefallen", "has fallen off the mast"],
  ["Überlebende wurden nicht gesichtet", "survivors were not sighted"],
  ["gekentertes Rettungsfloß", "capsized life raft"],
  ["zwei Personen an Bord", "two persons on board"],
  ["Schiffe in der Nähe werden gebeten …", "ships in vicinity are requested to …"],
  ["die Schifffahrt wird gebeten …", "shipping is requested to …"],
  ["scharf Ausschau halten", "to keep sharp lookout"],
  ["der Seenotleitung Bremen berichten", "report to Maritime Rescue Co-ordination Centre Bremen"],
  ["vorsichtig navigieren", "to navigate with caution / carefully"],
  ["weder ankern noch Fischereigeschirr nutzen", "neither to anchor nor to use fishing gear"],
  ["Abstand von mehr als 2 sm halten", "to keep a berth of more than 2 nm"],
  ["Küstenwache", "Coast Guard"],
  ["in der Nähe von · auf Position", "in vicinity of · in position"],
  ["Leucht- und Heultonne", "light and whistle buoy"],
  ["als verlöscht gemeldet", "is reported unlit"],
  ["Betonnung", "buoyage"],
  ["Fahrwasser", "fairway"],
  ["Verkehrstrennungsgebiet", "traffic separation scheme"],
  ["Tiefwasserweg", "deep water lane"],
  ["Nautische Warnung", "navigational warning"],
  ["Nachrichten für Seefahrer", "notices to mariners"],
  ["Unterwasser-Kabelarbeiten werden durchgeführt", "underwater cable operations in progress"],
  ["wird durchgeführt werden vom … bis …", "will be carried out from … to …"],
  ["laut · gemäß", "according to"],
  ["rote Raketen beobachtet", "red rockets observed"],
  ["treibende 40-Fuß-Container, rot gestrichen", "drifting 40-feet containers, red painted"],
  ["ein Container mit der Aufschrift …", "one container marked with …"],
  ["den Anker verloren", "has lost anchor"],
  ["rechtweisende Peilung 45 Grad", "true bearing of 45 degrees"],
  ["rechtweisender Kurs", "true course"],
  ["12 sm südlich Kap …", "12 nm south of Cape …"],
  ["Seemeile (sm)", "nautical mile (nm)"],
  ["Sturmwarnung", "gale warning"],
  ["Vorhersagegebiet", "forecast area"],
  ["Windstärke 8 bis 9", "force 8 to 9"],
  ["zunehmend auf Sturmstärke", "increasing to gale force"],
  ["abnehmend auf 7", "decreasing to force 7"],
  ["rasch zunehmend", "rapidly increasing"],
  ["rechtdrehend · linksdrehend", "veering · backing"],
  ["starke westliche Winde", "strong westerly winds"],
  ["raue See · sehr schwere See", "rough sea · very rough sea"],
  ["hohe Dünung", "high swell"],
  ["Sprühregen, zeitweise", "drizzle at times"],
  ["Schauer", "showers"],
  ["mäßige bis schlechte Sicht", "moderate to poor visibility"],
  ["überfällig seit 16. Januar", "overdue since January 16th"],
  ["unterwegs von … nach …", "underway from … to …"],
  ["mit Bestimmungshafen Visby", "bound for Visby"],
  ["ist bisher dort nicht eingetroffen", "has not yet arrived there"],
  ["verließ Klintholm um 0600 Ortszeit", "left Klintholm at 0600 local time"],
  ["Rumpf · Aufbauten · Segel", "hull · superstructures · sails"],
  ["Länge 12 m · Länge 40 Fuß", "length 12 m · length 40 feet"],
  ["Motorschiff · Rufzeichen", "M/V (motor vessel) · C/S (call sign)"],
  ["Geschwindigkeit 13 Knoten", "speed 13 knots"],
  ["folgendes empfangen auf UKW-Kanal 16", "following received on VHF channel 16"],
  ["gesichtet · beobachtet", "sighted · observed"],
  ["in diesem Gebiet", "in this area"],
  ["Komma (vom Prüfer vorgelesen)", "DECIMAL"],
];
  // pace: how long the prompt stands alone, then how long the pair stays up
  const PROMPT_MS = [1800, 2400, 3200, 4200, 5600];
  const ANSWER_MS = [1400, 1800, 2300, 2900, 3600];

  const wrap  = document.getElementById("wrap");
  const head  = document.getElementById("head");
  const tail  = document.getElementById("tail");
  const speed = document.getElementById("speed");
  const marks = document.querySelectorAll("#marks span");
  const lang  = document.getElementById("lang");
  const from  = document.getElementById("from");
  const to    = document.getElementById("to");

  // an entry that pairs terms with a dot is really two vocabulary items;
  // split it when both sides list the same number of terms, otherwise the
  // dot marks synonyms sharing one translation and the entry stays whole
  const CARDS = [];
  PAIRS.forEach(function (pair) {
    const a = pair[0].split("\u00B7"), b = pair[1].split("\u00B7");
    if (a.length > 1 && a.length === b.length) {
      for (let i = 0; i < a.length; i++) CARDS.push([a[i].trim(), b[i].trim()]);
    } else {
      CARDS.push(pair);
    }
  });

  let pace = 2;
  let dir = 0;                 // 0 = DE -> EN, 1 = EN -> DE
  let revealed = false;
  let deck = [], last = null;
  let timer = null;

  // settings persist in localStorage; silently ignored where it's unavailable
  function load(key) {
    try { return localStorage.getItem(key); } catch (e) { return null; }
  }
  function save(key, value) {
    try { localStorage.setItem(key, value); } catch (e) { /* no storage, no problem */ }
  }

  // every phrase comes up once per loop; a reshuffle never repeats the last one
  function draw() {
    if (!deck.length) {
      deck = CARDS.map(function (c, i) { return i; });
      for (let j = deck.length - 1; j > 0; j--) {
        const k = Math.floor(Math.random() * (j + 1));
        [deck[j], deck[k]] = [deck[k], deck[j]];
      }
      if (deck[deck.length - 1] === last && deck.length > 1) {
        [deck[deck.length - 1], deck[0]] = [deck[0], deck[deck.length - 1]];
      }
    }
    last = deck.pop();
    return CARDS[last];
  }

  // phrases run long, so the type shrinks until the pair clears the controls
  function fit() {
    const reserve = Math.max(58, window.innerHeight * 0.15);  // slider, labels, air
    const room = window.innerHeight / 2 - reserve;
    const min  = 15;
    let size = Math.min(window.innerWidth * 0.105, window.innerHeight * 0.115);
    wrap.style.fontSize = size + "px";
    let guard = 0;
    // the prompt phase rides half the translation's height lower, so budget for that
    while (size > min && guard++ < 60 && wrap.offsetHeight / 2 + drop() > room) {
      size *= 0.94;
      wrap.style.fontSize = size + "px";
    }
  }

  function drop() {
    const gap = parseFloat(getComputedStyle(tail).marginTop) || 0;
    return (tail.offsetHeight + gap) / 2;
  }

  // before the reveal the prompt sits centred; the translation waits underneath
  function place() {
    wrap.classList.add("instant");
    wrap.style.transform = "none";
    void wrap.offsetWidth;
    wrap.style.transform = revealed ? "translateY(0)" : "translateY(" + drop() + "px)";
    void wrap.offsetWidth;
  }

  function showPrompt() {
    const pair = draw();
    revealed = false;
    wrap.classList.remove("reveal");
    head.textContent = pair[dir];
    tail.textContent = pair[1 - dir];
    fit();
    place();
    timer = setTimeout(showAnswer, PROMPT_MS[pace]);
  }

  function showAnswer() {
    revealed = true;
    wrap.classList.remove("instant");
    void wrap.offsetWidth;
    wrap.style.transform = "translateY(0)";
    wrap.classList.add("reveal");
    timer = setTimeout(showPrompt, ANSWER_MS[pace]);
  }

  function restart() {
    clearTimeout(timer);
    deck = [];
    last = null;
    showPrompt();
  }

  function setPace() {
    pace = +speed.value;
    marks.forEach((m, n) => m.classList.toggle("on", n === pace));
    save("src.pace", pace);
  }

  const LABEL = ["Deutsch nach Englisch", "Englisch nach Deutsch"];
  function setDir() {
    from.textContent = dir ? "EN" : "DE";
    to.textContent   = dir ? "DE" : "EN";
    lang.setAttribute("aria-label", "Richtung: " + LABEL[dir]);
    lang.setAttribute("title", "Richtung: " + LABEL[dir]);
    save("src.dir", dir);
  }
  lang.addEventListener("click", function () {
    dir = 1 - dir;
    setDir();
    restart();
  });

  // theme: auto -> light -> dark -> auto
  const THEMES = ["auto", "light", "dark"];
  const root  = document.documentElement;
  const theme = document.getElementById("theme");

  let t = Math.max(0, THEMES.indexOf(load("src.theme")));
  function setTheme() {
    root.dataset.theme = THEMES[t];
    theme.setAttribute("aria-label", "Theme: " + THEMES[t]);
    theme.setAttribute("title", "Theme: " + THEMES[t]);
    save("src.theme", THEMES[t]);
  }
  theme.addEventListener("click", function () {
    t = (t + 1) % THEMES.length;
    setTheme();
  });
  setTheme();

  const savedPace = parseInt(load("src.pace"), 10);
  if (savedPace >= 0 && savedPace < PROMPT_MS.length) speed.value = savedPace;
  dir = load("src.dir") === "1" ? 1 : 0;
  setDir();

  speed.addEventListener("input", setPace);
  window.addEventListener("resize", function () { fit(); place(); });
  setPace();

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(showPrompt);
  } else {
    showPrompt();
  }
</script>
</body>
</html>
